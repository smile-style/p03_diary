services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: wxdaily_test
    ports:
      - "5433:5432"
    volumes:
      - test-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wxdaily_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  test-pgdata:
