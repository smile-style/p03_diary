services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ./server/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      STORAGE_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads

  backup:
    image: postgres:16
    restart: unless-stopped
    env_file: ./server/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deploy/backup.sh:/deploy/backup.sh:ro
      - ./backups:/backups
      - uploads:/data/uploads
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          sh /deploy/backup.sh
          sleep 86400
        done

volumes:
  pgdata:
  uploads:
