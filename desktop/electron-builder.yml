appId: com.wxdaily.desktop
productName: 生活记录
directories:
  output: release
files:
  - dist/**
  - package.json
  - node_modules/**
extraResources:
  - from: ../app/dist/build/h5
    to: web
win:
  target: nsis
nsis:
  artifactName: wx-daily-setup-${version}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: smile-style
  repo: p03_diary
# 待确认：仓库需可匿名读取 Release 资产。
# 若仍为私有，改用：
# publish:
#   provider: generic
#   url: https://<你的域名>/wx-daily/
